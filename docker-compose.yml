version: '3.8'

services:
  # ── MongoDB Database ────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: stratalign-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - stratalign-network
    restart: unless-stopped

  # ── Express Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stratalign-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/strat_align
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-service:8000/predict
    depends_on:
      - mongodb
    networks:
      - stratalign-network
    restart: unless-stopped

  # ── Python AI Microservice ──────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: stratalign-ai
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=http://localhost:5000,http://localhost:3000,http://localhost:5173
    networks:
      - stratalign-network
    restart: unless-stopped

  # ── React Frontend client ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stratalign-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - stratalign-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  stratalign-network:
    driver: bridge
